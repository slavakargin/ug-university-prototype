site_name: "Mathematical Sciences Undergraduate Program (Prototype)"
site_url: https://slavakargin.github.io/ug-university-prototype/
site_description: "Prototype of stable UG-program pages for migration to the university website."
site_author: "Binghamton University Department of Mathematical Sciences (draft)"

docs_dir: docs_gen

theme:
  name: readthedocs

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - tables

nav:
  - Home: index.md

  - Overview:
      - Program overview: content/overview/ug-program.md
      - Math education (teaching): content/overview/math-education.md
      - Honors and awards: content/overview/honors-awards.md
      - Summer and winter sessions: content/overview/summer-winter-sessions.md
      - Careers and opportunities: content/overview/careers-opportunities.md

  - Tracks:
      - Tracks overview: content/tracks/index.md
      - Mathematics (BA/BS): content/tracks/pure-math.md
      - Actuarial Science (BA/BS): content/tracks/actuarial.md
      - Data Science & Statistics (BA/BS): content/tracks/data-science.md

  - Policies:
      - Requirements and catalog year: content/policies/requirements-catalog-year.md
      - Minimum grades and repeats: content/policies/minimum-grades-repeats.md
      - Transfer and exam credit: content/policies/transfer-exam-credit.md
      - Petitions and exceptions: content/policies/petitions-exceptions.md




